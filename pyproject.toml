[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[project]
name = "floopy-sdk"
version = "0.1.0" # x-release-please-version
description = "Official Floopy AI Gateway SDK for Python. Drop-in replacement for the openai SDK with cache, audit, experiments, and security on top."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Floopy" }]
keywords = [
  "floopy",
  "openai",
  "ai",
  "gateway",
  "llm",
  "sdk",
  "anthropic",
  "gemini",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "openai>=1.60,<2",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://floopy.ai/docs/sdk/python"
Documentation = "https://floopy.ai/docs/sdk/python"
Repository = "https://github.com/FloopyAI/floopy-python"
Issues = "https://github.com/FloopyAI/floopy-python/issues"
Changelog = "https://github.com/FloopyAI/floopy-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-asyncio>=1.3.0",
  "respx>=0.23.1",
  "ruff>=0.15.13",
  "mypy>=2.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/floopy"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PLE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["floopy"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["respx", "respx.*"]
ignore_missing_imports = true
