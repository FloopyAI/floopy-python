name: Release

# release-please opens/updates a release PR with the next version computed
# from Conventional Commits since the last tag. When that PR is merged the
# action creates the tag + GitHub Release; this job then publishes the
# sdist + wheel to PyPI via Trusted Publishing (OIDC) with PEP 740
# attestations.
#
# Security policy: publishing uses OIDC Trusted Publishing — there is NO
# long-lived PyPI token stored in this repo. `id-token: write` is required
# for the OIDC exchange, and attestations let consumers verify the artifact
# was built by this exact workflow run. Configure the trusted publisher on
# PyPI first: project `floopy-sdk`, owner `FloopyAI`, repo `floopy-python`,
# workflow `release.yml`, environment `pypi`.

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to PyPI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/floopy-sdk/
    permissions:
      contents: read
      id-token: write # OIDC for Trusted Publishing + attestations
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --python 3.12

      - name: Type check (mypy --strict)
        run: uv run mypy

      - name: Test
        run: uv run pytest

      - name: Build sdist + wheel
        run: uv build

      - name: Verify distribution metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI (Trusted Publishing + attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
